name: Build and Deploy Godot Web

on:
  push:
    branches:
      - main
      - web-pwa-deployment
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      GODOT_STATUS: "stable"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /tmp/godot/godot
          chmod +x /tmp/godot/godot

      - name: Install Godot export templates
        run: |
          curl -L -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

      - name: Import project assets
        run: /tmp/godot/godot --headless --path . --editor --quit

      - name: Export release web build
        run: |
          # Never let a previous export survive into the Pages artifact.
          rm -rf build/web
          mkdir -p build/web
          /tmp/godot/godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Version web cache for this build
        run: |
          # Godot PWA exports use stable filenames, so Safari can keep an older
          # service-worker cache after a successful Pages deployment. Give the
          # generated service worker a build-specific cache namespace.
          WORKER="$(find build/web -maxdepth 1 -type f -name '*.service.worker.js' -print -quit)"
          if [ -n "$WORKER" ]; then
            # Godot 4.3 derives CACHE_NAME from CACHE_PREFIX + CACHE_VERSION.
            # Stamp CACHE_VERSION itself so every deployment activates a fresh cache.
            sed -i "s/^const CACHE_VERSION = .*/const CACHE_VERSION = '${GITHUB_SHA}';/" "$WORKER"
            grep -q "const CACHE_VERSION = '${GITHUB_SHA}';" "$WORKER"
            echo "Versioned service worker cache with ${GITHUB_SHA}."
          else
            echo "No Godot service worker found; continuing without PWA cache patch."
          fi
          printf '%s\n' "${GITHUB_SHA}" > build/web/build-version.txt

      - name: Validate guided hunt and save compatibility
        env:
          XDG_DATA_HOME: /tmp/cryptid-camp-tests
        run: |
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/smoke_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/camp_home_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/first_hunt_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/sanctuary_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/decorating_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/adoption_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/storybook_test.gd
          timeout 90s /tmp/godot/godot --headless --path . --script res://tests/encounter_guidance_test.gd

      - name: Verify required web files
        run: |
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          test -f build/web/index.icon.png
          test -f build/web/index.apple-touch-icon.png
          test -f build/web/index.manifest.json
          grep -q 'index.icon.png' build/web/index.html
          grep -q 'index.apple-touch-icon.png' build/web/index.html
          grep -q "${GITHUB_SHA}" build/web/index.service.worker.js
          test "$(cat build/web/build-version.txt)" = "${GITHUB_SHA}"
          echo "Web export contains the expected Godot runtime files and deployment version."

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: cryptid-camp-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
